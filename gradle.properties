# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# On-device AI: which accelerator backend core/ai/local compiles pam_llama's llama.cpp
# against. Left commented — the default stays "none" (CPU-only) for every normal build.
# Uncomment (or pass -Ppam.gpuBackend=vulkan on the command line instead) to build the
# Vulkan backend in too; see documentation/02-architecture.md §5.3 and the comment in
# core/ai/local/build.gradle.kts for what that needs on this machine.
#pam.gpuBackend=vulkan
